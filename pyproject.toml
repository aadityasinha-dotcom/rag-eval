[project]
name = "rag-eval"
version = "0.1.0"
description = "Document Q&A where retrieval quality is a measured metric."
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.12,<0.14",
    "llama-index-readers-file>=0.4,<0.6",
    "beautifulsoup4>=4.12",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "retrieval", "generation", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ingest", "evals"]
ignore_missing_imports = true
